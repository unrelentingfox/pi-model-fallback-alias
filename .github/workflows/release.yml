name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v5

  detect-publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should-publish: ${{ steps.status.outputs.should-publish }}
      tag: ${{ steps.status.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: status
        run: node scripts/release-publish-status.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

  publish:
    needs: detect-publish
    if: needs.detect-publish.outputs.should-publish == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.detect-publish.outputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@^11.5.1
      - run: npm ci
      - run: npm run check
      - run: npm publish --access public --provenance
